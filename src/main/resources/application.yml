spring:
  application:
    name: milk-collection

  datasource:
    url: "jdbc:mysql://localhost:3306/dairydb?createDatabaseIfNotExist=true"
    username: root
    password: ${DB_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

dairy:
  spoilage-threshold-minutes: 180